<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mainex — Page not found</title>
  <meta name="description" content="The page you were looking for doesn't exist on mainex.app.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0D1117;
      color: #F3F6FB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 24px;
      line-height: 1.5;
    }
    header { width: 100%; max-width: 600px; padding: 16px 0; }
    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #58A6FF;
      text-decoration: none;
      display: inline-block;
    }
    .brand:hover { color: #79B8FF; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 600px;
      width: 100%;
      text-align: center;
      gap: 24px;
      padding: 48px 0;
    }
    .error-code {
      font-size: clamp(72px, 14vw, 120px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
      color: #58A6FF;
    }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
    }
    .tagline {
      font-size: clamp(15px, 2.5vw, 17px);
      color: #9BA3AF;
      max-width: 480px;
    }
    .home-link {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 28px;
      background-color: #58A6FF;
      color: #0A0E14;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      transition: background-color 0.15s;
    }
    .home-link:hover { background-color: #79B8FF; }
    footer {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding-top: 32px;
      border-top: 1px solid #21262D;
    }
    .legal-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      justify-content: center;
    }
    .legal-links a {
      color: #58A6FF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 0;
      transition: color 0.15s;
    }
    .legal-links a:hover {
      color: #79B8FF;
      text-decoration: underline;
    }
    .copyright {
      font-size: 13px;
      color: #6E7681;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">MAINEX</a>
  </header>
  <main>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p class="tagline">The page you were looking for doesn't exist or has been moved.</p>
    <a href="/" class="home-link">Go to homepage</a>
  </main>
  <footer>
    <nav class="legal-links">
      <a href="/privacy-policy.html">Privacy Policy</a>
      <a href="/terms-of-service.html">Terms of Service</a>
      <a href="/support.html">Support</a>
    </nav>
    <div class="copyright">© 2026 Alan Jacinto. All rights reserved.</div>
  </footer>
</body>
</html>
